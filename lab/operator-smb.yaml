# PirateCrew lab OPERATOR template - authenticated access to the protected SMB share.
#
# Closes the lab loop: the password of "svc-sauvegarde", left by the intranet in
# sauvegardes/intranet.conf.bak, opens the "archives" share (denied anonymously).
# This is the deterministic step the LLM author cannot produce reliably (its
# template has to stay generic and free of literal values).
#
# To enable it - the operator arsenal stays LOCAL (catalog/operator/*.yaml is not versioned):
#     cp lab/operator-smb.yaml catalog/operator/smb.yaml
#
# The command runs in the filtered network namespace, as argv (shell=False): the
# "%" and "!" of the user%password pair are not interpreted by a shell.
- id: smb.auth_share_archives
  name: Authenticated access to the protected SMB share (archives)
  domain: ad
  service: smb
  requires: [credential]
  tool: smbclient
  command_template: "smbclient //{target}/archives -U {user}%{password} -c ls"
  success_signal: "blocks of size"
  provided_by: operator
  opens_session: false
