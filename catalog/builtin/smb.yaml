# Builtin techniques — SMB (authorized, non-sensitive enumeration).
- id: smb.port_probe
  name: SMB/NetBIOS port probe
  domain: recon
  service: smb
  requires: []
  tool: smb_port_probe
  command_template: ""
  success_signal: "445=OPEN"
  provided_by: builtin

- id: smb.enum_shares
  name: SMB share listing (null session)
  domain: ad
  service: smb
  requires: []
  tool: smbclient
  command_template: "smbclient -L //{target} -N"
  success_signal: "Sharename"
  provided_by: builtin
