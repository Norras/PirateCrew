# Builtin techniques — reconnaissance (standard, non-sensitive enumeration).
# Reconnaissance is done by the mission's recon phase, not planned per
# service: `service: recon` (no discovered service has that name). With "*",
# these techniques would be re-run on every discovered service.
- id: nmap.quick
  name: Quick nmap scan
  domain: recon
  service: recon
  requires: []
  tool: nmap
  command_template: "nmap -T4 -F {target}"
  success_signal: "open"
  provided_by: builtin

- id: tcp.check
  name: TCP port check (pure-Python socket)
  domain: recon
  service: recon
  requires: []
  tool: tcp_port_check
  command_template: ""
  success_signal: "OPEN"
  provided_by: builtin
