# Builtin techniques — web (HTTP fingerprint, non-sensitive).
- id: http.fingerprint
  name: HTTP fingerprint (status code + revealing headers)
  domain: web
  service: http
  requires: []
  tool: http_fingerprint
  command_template: "http_fingerprint http://{target}:{port}/"
  success_signal: "HTTP"
  provided_by: builtin
- id: http.get
  name: HTTP content read (body, directory listing, served file)
  domain: web
  service: http
  requires: []
  tool: http_get
  command_template: "http_get http://{target}:{port}/"
  success_signal: "HTTP"
  provided_by: builtin
- id: http.harvest
  name: Read listed content (index + exposed files)
  domain: web
  service: http
  requires: []
  tool: http_get_listing
  command_template: "http_get_listing http://{target}:{port}/"
  success_signal: "HTTP"
  provided_by: builtin
