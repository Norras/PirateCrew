# ============================================================================
# OPERATOR TEMPLATES — example (NOT loaded by the catalog).
#
# Copy this file (or some of its entries) to catalog/operator/<name>.yaml, then
# FILL IN the `command_template` values yourself for your AUTHORIZED targets.
# The `command_template` values ship EMPTY: the specific offensive arsenal
# belongs to you. The real files in catalog/operator/ are not versioned
# (see .gitignore: catalog/operator/*.yaml).
#
# Same format as the builtin techniques. `requires` lists the prerequisites
# the world model must satisfy for the technique to be offered
# (e.g. [credential] = an applicable credential must exist).
# ============================================================================

